<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>온기 지도</title>
<style>html,body,#map{margin:0;width:100%;height:100%}</style>
</head>
<body>
<div id="map"></div>
<script>
  // 온기 홈페이지 '위치 보기'에 들어가는 네이버 지도 (주소창 값: lat, lng, id)
  var p = new URLSearchParams(location.search);
  var lat = parseFloat(p.get("lat")), lng = parseFloat(p.get("lng")), id = (p.get("id") || "").replace(/[^A-Za-z0-9]/g, "");
  if (isFinite(lat) && isFinite(lng) && id) {
    var s = document.createElement("script");
    s.src = "https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=" + id;
    s.onload = function () {
      var pos = new naver.maps.LatLng(lat, lng);
      var map = new naver.maps.Map("map", { center: pos, zoom: 17, zoomControl: true, zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT } });
      new naver.maps.Marker({ position: pos, map: map });
    };
    document.head.appendChild(s);
  }
</script>
</body>
</html>
